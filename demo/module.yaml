product: jvm/app

settings:
  jvm:
    mainClass: demo.MainKt
  kotlin:
    version: 2.4.20-RC
    freeCompilerArgs:
      - -Xcollection-literals

plugins:
  protobuf-plugin:
    enabled: true
    target: GRPC_KOTLIN
    version: V4

dependencies:
  - $libs.kotlinx.coroutines
  - $libs.protobuf.java
  - $libs.protobuf.kotlin
  - $libs.grpc.protobuf
  - $libs.grpc.stub
  - $libs.grpc.kotlin.stub

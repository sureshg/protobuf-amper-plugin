product: jvm/amper-plugin

settings:
  kotlin:
    version: 2.4.20-RC
    freeCompilerArgs:
      - -Xcollection-literals
      - -Xcontext-sensitive-resolution

dependencies:
  - $libs.protobuf4j.v3
  - $libs.protobuf4j.v4
  - io.grpc:protoc-gen-grpc-kotlin:1.5.0:jdk8 # grpc-kotlin codegen, pure JVM, no native binary
  - $libs.zerofs

pluginInfo:
  settingsClass: Settings
